[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:mailvotech-email]
command=php /var/www/html/bin/console messenger:consume email --time-limit=3600 --memory-limit=256M --no-interaction
directory=/var/www/html
user=www-data
numprocs=1
startsecs=0
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mailvotech-hit]
command=php /var/www/html/bin/console messenger:consume hit --time-limit=3600 --memory-limit=256M --no-interaction
directory=/var/www/html
user=www-data
numprocs=1
startsecs=0
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mailvotech-failed]
command=php /var/www/html/bin/console messenger:consume failed --time-limit=3600 --memory-limit=256M --no-interaction
directory=/var/www/html
user=www-data
numprocs=1
startsecs=0
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
