mailvotech.point.trigger.onboarding.eyebrow="Understand"
mailvotech.point.trigger.onboarding.heading="How point triggers work?"
mailvotech.point.trigger.onboarding.copy="Triggers execute predefined actions – like changing a segment, adding a tag, or pushing to your CRM – the moment a contact reaches a specific score."
mailvotech.point.trigger.onboarding.step1="Create a new trigger and set the minimum number of points a contact must reach."
mailvotech.point.trigger.onboarding.step2="Select one or more events to execute when the point threshold is met."
mailvotech.point.trigger.onboarding.step3="Publish the trigger. You can choose whether to apply it immediately to existing contacts who already meet the criteria."
mailvotech.point.trigger.onboarding.notification.title="Triggers act differently from campaign-based events"
mailvotech.point.trigger.onboarding.notification.content="They activate whenever the score threshold is met, ensuring immediate action based on engagement level."
mailvotech.point.trigger.onboarding.group.heading="Setting up score-triggered events"
mailvotech.point.trigger.onboarding.cta="Create new trigger"
mailvotech.point.trigger.onboarding.usecase.eyebrow="Use case"
mailvotech.point.trigger.onboarding.usecase.heading="Applying practically"
mailvotech.point.group.onboarding.heading="Gain deeper insight with granular lead scoring"
mailvotech.point.group.onboarding.subheading="Go beyond a single engagement score. Groups allow you to categorize points based on different types of interactions or interests."
mailvotech.point.group.onboarding.copy="Track separate scores for engagement with specific product lines, content topics, or funnel stages. This gives you a much richer understanding of what your contacts are interested in, not just how engaged they are overall."
